name:                life
version:             0.1.0.0
github:              "exsabersac/life"
license:             BSD-3-Clause
author:              "yu binbin"
maintainer:          "exsabersac"
copyright:           "2026 yu binbin"

extra-source-files:
- README.md
- LICENSE

description:        Haskell 元胞自动机 / 生命游戏，可换 B/S 规则（Stack + 纯库 + SDL2）

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  dependencies:
  - array
  - containers
  - text
  exposed-modules:
  - Life.Types
  - Life.Rule
  - Life.Grid
  - Life.Step
  - Life.Stream
  - Life.World
  - Life.Pattern
  - Life.Cells

executables:
  life-sdl:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - life
    - sdl2
    - text

tests:
  life-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - life
    - tasty
    - tasty-hunit
    - tasty-quickcheck
    - text
